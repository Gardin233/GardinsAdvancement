tabs:
  
  explorer_path:
    display-mode: direct
    background: "minecraft:textures/block/deepslate.png"
    advancements:
      explorer_root:
        type: root
        conditions:
          - "placeholder: %player_level% >= 0"
        commands:
          - "say %player_name% 已解锁 explorer_root"
        data:
          title: "探索开始"
          icon: CE:dwserveronly:copper_coin
          frame: task
          show_toast: true
          announce_chat: true
          x: 10
          y: 20
          description:
            - "这是第二条线路的根节点"
      explorer_step_one:
        type: common
        parent: explorer_root
        conditions:
          - "placeholder: %player_level% >= 10"
        commands: |
          say %player_name% 已达成 explorer_step_one
          give %player_name% minecraft:emerald 1
        data:
          title: "探索者 I"
          icon: minecraft:acacia_boat
          frame: goal
          show_toast: true
          announce_chat: true
          x: 12
          y: 18
          description:
            - "这个普通节点绑定在 explorer_root 下"
      explorer_step_two:
        type: common
        parent: explorer_root
        conditions:
          - "placeholder: %player_level% >= 15 && %player_food_level% >= 16"
        commands:
          - "say %player_name% 已达成 explorer_step_two"
          - "experience add %player_name% 10 levels"
        data:
          title: "探索者 II"
          icon: minecraft:acacia_door
          frame: challenge
          show_toast: true
          announce_chat: true
          x: 12
          y: 22
          description:
            - "这个普通节点也绑定在 explorer_root 下"
