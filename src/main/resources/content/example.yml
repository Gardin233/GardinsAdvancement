tabs:
  novice_path:
    name: "&6新手之路"
    icon: DIAMOND
    background: "minecraft:textures/block/stone.png"
    advancements:
      novice_root:
        type: root
        data:
          title: "&a初入世界"
          icon: CE:namespace:PAPER
          frame: task
          show_toast: true
          announce_chat: true
          x: 10
          y: 20
          description:
            - "&7这是新手线路的根节点"
      novice_step_one:
        type: common
        parent: novice_root
        conditions:
          - "placeholder: %player_level% >= 5"
        data:
          title: "&b迈出第一步"
          icon: CE:customfishing:sturgeon_fish_golden_star
          frame: goal
          show_toast: true
