            - "&7这是第二条线路的根节点"

      explorer_step_one:
        type: common
        parent: explorer_root
        conditions:
          - "placeholder: %player_level% >= 10"
        data:
          title: "&b探索者 I"
          icon: CE:namespace:PAPER
          frame: goal
          show_toast: true
          announce_chat: true
          x: 12
          y: 18
          description:
            - "&7这个普通节点绑定在 explorer_root 下"
      explorer_step_two:
        type: common
        parent: explorer_root
        conditions:
          - "placeholder: %player_level% >= 15 && %player_food_level% <= 17"
        data:
          title: "&d探索者 II"
          icon: CE:namespace:PAPER
          frame: challenge
          show_toast: true
          announce_chat: true
          x: 12
          y: 22
          description:
            - "&7这个普通节点也绑定在 explorer_root 下"


