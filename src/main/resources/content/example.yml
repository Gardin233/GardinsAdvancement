tabs:
  novice_path:
    # Tab 显示模式:
    # direct   -> 直接显示 Tab，即使玩家还没有这个页签下的任何成就
    # indirect -> 通过自动授予 root 间接显示 Tab
    # manual   -> 不自动处理 Tab 显示
    display-mode: direct
    background: "minecraft:textures/block/stone.png"
    advancements:
      novice_root:
        type: root
        conditions:
          - "placeholder: %player_level% >= 0"
        data:
          title: "初入世界"
          icon: minecraft:acacia_door
          frame: task
          show_toast: true
          announce_chat: true
          x: 10
          y: 20
          description:
            - "这是新手线路的根节点"
      novice_step_one:
        type: common
        parent: novice_root
        conditions:
          - "placeholder: %player_level% >= 5"
        data:
          title: "迈出第一步"
          icon: CE:customfishing:sturgeon_fish_golden_star
          frame: goal
          show_toast: true
          announce_chat: true
          x: 12
          y: 20
          description:
            - "这个普通节点绑定在 novice_root 下"

