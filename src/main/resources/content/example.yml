tabs:
  novice_path:
    # Tab 显示模式:
    # direct   -> 直接显示 Tab，即使玩家还没有这个页签下的任何成就
    # indirect -> 通过自动授予 root 间接显示 Tab
    # manual   -> 不自动处理 Tab 显示
    display-mode: direct
    background: "minecraft:textures/block/stone.png"
    advancements:
      novice_root:
        type: root
        conditions:
          - "placeholder: %player_level% >= 0"
        commands:
          - "say %player_name% 已解锁根成就 novice_root"
          - "tell %player_name% &a欢迎来到新手之路"
        data:
          title: "&a初入世界"
          icon: minecraft:acacia_door
          frame: task
          show_toast: true
          announce_chat: true
          x: 10
          y: 20
          description:
            - "&7这是新手线路的根节点"
      novice_step_one:
        type: common
        parent: novice_root
        conditions:
          - "placeholder: %player_level% >= 5"
        commands: |
          say %player_name% 已达成 novice_step_one
          give %player_name% minecraft:diamond 1
        data:
          title: "&b迈出第一步"
          icon: CE:customfishing:sturgeon_fish_golden_star
          frame: goal
          show_toast: true
          announce_chat: true
          x: 12
          y: 20
          description:
            - "&7这个普通节点绑定在 novice_root 下"

